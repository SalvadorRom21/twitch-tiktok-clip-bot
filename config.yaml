# Twitch-to-TikTok Clip Bot configuration
# Copy to config.local.yaml to override, or set env vars (see README).

twitch:
  client_id: ""
  client_secret: ""
  broadcaster_id: ""
  max_clips: 5
  max_vods: 3

vod:
  # TikTok shorts generated per full stream VOD
  max_shorts_per_vod: 5
  # Min gap between highlights (seconds) so shorts don't overlap
  min_short_gap_sec: 120
  # Chunk sizes for long VOD analysis
  audio_scan_chunk_sec: 600
  whisper_chunk_sec: 300
  peak_candidate_limit: 80
  # Limit download length for testing (0 = full VOD)
  max_download_sec: 0

analysis:
  whisper_model: "base"  # tiny, base, small, medium, large-v3
  whisper_device: "cpu"  # cpu or cuda
  whisper_compute_type: "int8"  # int8, float16, float32
  vision_frame_interval_sec: 5

editing:
  target_duration_sec: 30
  min_duration_sec: 15
  max_duration_sec: 60
  silence_threshold_sec: 0.4
  peak_percentile: 85
  max_zoom_effects: 3
  caption_style: "bold"
  montage_enabled: true
  max_montage_segments: 4
  min_segment_sec: 4
  max_segment_sec: 12

render:
  width: 1080
  height: 1920
  fps: 30
  ffmpeg_path: ""
  face_crop_enabled: true
  face_sample_count: 8

llm:
  enabled: false
  api_key_env: "OPENAI_API_KEY"
  base_url: ""
  model: "gpt-4o-mini"

paths:
  data_dir: "data"
  output_dir: "output"
  sfx_dir: "assets/sfx"

web:
  host: "127.0.0.1"
  port: 8080
