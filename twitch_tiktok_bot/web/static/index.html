<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twitch → TikTok Preview</title>
  <style>
    :root {
      --bg: #0f0f12;
      --panel: #1a1a22;
      --border: #2d2d3a;
      --text: #f2f2f7;
      --muted: #9b9bb0;
      --accent: #9146ff;
      --accent-2: #00f2ea;
      --ok: #3dd68c;
      --warn: #f5a524;
      --bad: #f31260;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #1b1230, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    h1 { margin: 0; font-size: 1.35rem; }
    .subtitle { color: var(--muted); font-size: 0.9rem; }
    main {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 1.25rem;
      padding: 1.25rem 2rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
    input, textarea, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    input, textarea {
      width: 100%;
      background: #12121a;
      color: var(--text);
      padding: 0.65rem 0.75rem;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      cursor: pointer;
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.65rem 1rem;
      font-weight: 600;
    }
    button.secondary { background: #2a2a38; }
    button.ok { background: #1f6b4a; }
    button.bad { background: #7a1f35; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .stack { display: grid; gap: 0.75rem; }
    .clip-list { display: grid; gap: 0.5rem; max-height: 70vh; overflow: auto; }
    .clip-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem;
      cursor: pointer;
      background: #14141c;
    }
    .clip-item.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .clip-item h3 { margin: 0 0 0.25rem; font-size: 0.95rem; }
    .meta { color: var(--muted); font-size: 0.8rem; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge.ready { background: #1c3b4a; color: var(--accent-2); }
    .badge.processing { background: #3a2f14; color: var(--warn); }
    .badge.approved { background: #163a2c; color: var(--ok); }
    .badge.rejected, .badge.failed { background: #3a1622; color: var(--bad); }
    .preview-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1rem;
      align-items: start;
    }
    video {
      width: 100%;
      max-width: 320px;
      border-radius: 12px;
      background: black;
      border: 1px solid var(--border);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 3rem 1rem;
    }
    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
      .preview-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Twitch → TikTok Preview</h1>
      <div class="subtitle">Review montages, tweak captions, approve before upload</div>
    </div>
    <button class="secondary" id="refreshBtn">Refresh</button>
  </header>

  <main>
    <section class="panel stack">
      <div>
        <label for="clipUrl">Twitch clip URL</label>
        <input id="clipUrl" placeholder="https://clips.twitch.tv/..." />
      </div>
      <div>
        <label for="clipTitle">Title (optional)</label>
        <input id="clipTitle" placeholder="Clutch round" />
      </div>
      <button id="processBtn">Process clip</button>
      <div class="clip-list" id="clipList"></div>
    </section>

    <section class="panel" id="previewPanel">
      <div class="empty" id="emptyState">Select a clip or process a new one to preview.</div>
      <div id="previewContent" hidden>
        <div class="preview-grid">
          <video id="player" controls playsinline></video>
          <div class="stack">
            <div>
              <span class="badge" id="statusBadge">ready</span>
              <div class="meta" id="clipMeta"></div>
            </div>
            <div>
              <label for="captionBox">Caption for TikTok</label>
              <textarea id="captionBox"></textarea>
            </div>
            <div class="actions">
              <button id="saveCaptionBtn">Save caption</button>
              <button class="ok" id="approveBtn">Approve</button>
              <button class="bad" id="rejectBtn">Reject</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    let selectedId = null;
    let pollTimer = null;

    const clipList = document.getElementById("clipList");
    const emptyState = document.getElementById("emptyState");
    const previewContent = document.getElementById("previewContent");
    const player = document.getElementById("player");
    const statusBadge = document.getElementById("statusBadge");
    const clipMeta = document.getElementById("clipMeta");
    const captionBox = document.getElementById("captionBox");

    async function fetchClips() {
      const res = await fetch("/api/clips");
      return res.json();
    }

    async function fetchCaption(id) {
      const res = await fetch(`/api/clips/${id}/caption`);
      return res.json();
    }

    function badgeClass(status) {
      return `badge ${status}`;
    }

    function renderList(clips) {
      clipList.innerHTML = "";
      if (!clips.length) {
        clipList.innerHTML = '<div class="meta">No clips yet.</div>';
        return;
      }
      for (const clip of clips) {
        const el = document.createElement("div");
        el.className = "clip-item" + (clip.id === selectedId ? " active" : "");
        el.innerHTML = `
          <h3>${clip.title || clip.id}</h3>
          <div class="meta">${clip.segment_count || 0} segments · ${clip.status}</div>
          <span class="${badgeClass(clip.status)}">${clip.status}</span>
        `;
        el.onclick = () => selectClip(clip.id);
        clipList.appendChild(el);
      }
    }

    async function selectClip(id) {
      selectedId = id;
      const clips = await fetchClips();
      renderList(clips);
      const clip = clips.find((c) => c.id === id);
      if (!clip) return;

      emptyState.hidden = true;
      previewContent.hidden = false;
      statusBadge.className = badgeClass(clip.status);
      statusBadge.textContent = clip.status;
      const face = clip.face_crop_center_x != null
        ? `Face crop: ${(clip.face_crop_center_x * 100).toFixed(0)}%`
        : "Face crop: center";
      clipMeta.textContent = `${face} · ${clip.segment_count || 0} montage segments`;
      if (clip.status === "ready" || clip.status === "approved" || clip.status === "rejected") {
        player.src = `/api/clips/${id}/video?ts=${Date.now()}`;
      } else {
        player.removeAttribute("src");
        player.load();
      }
      if (clip.error) clipMeta.textContent += ` · Error: ${clip.error}`;

      const caption = await fetchCaption(id);
      captionBox.value = caption.caption || "";
      document.getElementById("approveBtn").disabled = clip.status !== "ready";
    }

    async function refresh() {
      const clips = await fetchClips();
      renderList(clips);
      if (selectedId) await selectClip(selectedId);
      const processing = clips.some((c) => c.status === "processing");
      if (processing && !pollTimer) {
        pollTimer = setInterval(refresh, 3000);
      } else if (!processing && pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    document.getElementById("processBtn").onclick = async () => {
      const clip_url = document.getElementById("clipUrl").value.trim();
      const title = document.getElementById("clipTitle").value.trim();
      if (!clip_url) return alert("Enter a Twitch clip URL");
      const res = await fetch("/api/process", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ clip_url, title }),
      });
      const job = await res.json();
      selectedId = job.id;
      document.getElementById("clipUrl").value = "";
      await refresh();
    };

    document.getElementById("saveCaptionBtn").onclick = async () => {
      if (!selectedId) return;
      await fetch(`/api/clips/${selectedId}/caption`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ caption: captionBox.value }),
      });
      await refresh();
    };

    document.getElementById("approveBtn").onclick = async () => {
      if (!selectedId) return;
      await fetch(`/api/clips/${selectedId}/approve`, { method: "POST" });
      await refresh();
    };

    document.getElementById("rejectBtn").onclick = async () => {
      if (!selectedId) return;
      await fetch(`/api/clips/${selectedId}/reject`, { method: "POST" });
      await refresh();
    };

    document.getElementById("refreshBtn").onclick = refresh;
    refresh();
  </script>
</body>
</html>
